name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed 'tools' package, which now fails.
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      # Host tools used by build_android_runtime_native.py (make, patch, awk, sh, tar, xz, gzip, bzip2).
      # ubuntu-latest ships them; the step fails loudly if a runner image drops one.
      - name: Check host tools for the native source build
        run: |
          for tool in python3 make patch awk tar xz gzip bzip2; do
            command -v "$tool" > /dev/null || { echo "::error::Missing host tool: $tool"; exit 1; }
          done

      - uses: gradle/actions/setup-gradle@v4

      # Cache keys cover the source lock, the prepare/build scripts and the pinned NDK, so any change to
      # those inputs starts from a fresh source preparation.
      - name: Cache prepared runtime sources
        id: cache-runtime-sources
        uses: actions/cache@v4
        with:
          path: build/runtime-sources
          key: runtime-sources-v1-${{ hashFiles('runtime_tools/runtime_sources.lock.json', 'scripts/prepare_android_runtime_sources.py') }}

      - name: Cache native runtime JNI output
        uses: actions/cache@v4
        with:
          path: build/generated/runtime-jni
          key: runtime-jni-v1-ndk29.0.14206865-${{ hashFiles('runtime_tools/runtime_sources.lock.json', 'scripts/build_android_runtime_native.py', 'scripts/prepare_android_runtime_sources.py', 'runtime_tools/patches/**') }}

      # Network step. It runs before Gradle; the Gradle build itself never downloads source.
      - name: Prepare runtime sources
        if: steps.cache-runtime-sources.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_android_runtime_sources.py --output-dir build/runtime-sources

      - name: Python script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndChamber-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
